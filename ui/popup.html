<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Privacy Visualizer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
      background: #f8f9fa;
      color: #1a1a1a;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .header h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    
    .header p {
      font-size: 13px;
      opacity: 0.95;
      font-weight: 500;
    }
    
    .container {
      padding: 20px;
      max-height: 600px;
      overflow-y: auto;
    }
    
    .container::-webkit-scrollbar {
      width: 6px;
    }
    
    .container::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    
    .container::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 3px;
    }
    
    .container::-webkit-scrollbar-thumb:hover {
      background: #999;
    }
    
    #results {
      animation: fadeIn 0.4s ease-out;
    }
    
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Grade Card */
    .grade-card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      text-align: center;
      border-top: 4px solid #667eea;
    }
    
    .grade-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      color: #666;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    
    .grade-display {
      font-size: 56px;
      font-weight: 800;
      line-height: 1;
      margin: 8px 0;
      letter-spacing: -2px;
    }
    
    .grade-display.A { color: #10b981; }
    .grade-display.B { color: #3b82f6; }
    .grade-display.C { color: #f59e0b; }
    .grade-display.D { color: #ef5350; }
    .grade-display.F { color: #dc2626; }
    
    .grade-text {
      font-size: 16px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }
    
    .grade-subtext {
      font-size: 12px;
      color: #999;
    }
    
    /* Section */
    .section {
      background: white;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }
    
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }
    
    /* Tracker Items */
    .tracker-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .tracker-item {
      background: #f9f9f9;
      padding: 10px 12px;
      border-radius: 8px;
      border-left: 3px solid #667eea;
      transition: all 0.2s ease;
      font-size: 13px;
    }
    
    .tracker-item:hover {
      background: #f1f1f1;
      transform: translateX(2px);
    }
    
    .tracker-item.high {
      border-left-color: #ef5350;
    }
    
    .tracker-item.medium {
      border-left-color: #f59e0b;
    }
    
    .tracker-item.low {
      border-left-color: #10b981;
    }
    
    .tracker-name {
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 4px;
    }
    
    .tracker-meta {
      display: flex;
      gap: 8px;
      font-size: 11px;
      color: #666;
    }
    
    .tracker-badge {
      background: rgba(0, 0, 0, 0.05);
      padding: 2px 6px;
      border-radius: 3px;
      font-weight: 500;
    }
    
    .risk-high { color: #ef5350; }
    .risk-medium { color: #f59e0b; }
    .risk-low { color: #10b981; }
    
    /* Countries */
    .countries-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    
    .country-tag {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 500;
      display: inline-block;
    }
    
    /* Tips */
    .tips-list {
      list-style: none;
      font-size: 12px;
      color: #166534;
      line-height: 1.6;
    }
    
    .tips-list li {
      padding-left: 20px;
      margin: 6px 0;
      position: relative;
    }
    
    .tips-list li:before {
      content: "✓";
      position: absolute;
      left: 0;
      font-weight: bold;
      color: #16a34a;
    }
    
    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
    }
    
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    
    .empty-state-text {
      font-size: 13px;
      color: #666;
      margin-bottom: 4px;
      font-weight: 500;
    }
    
    .empty-state-subtext {
      font-size: 12px;
      color: #999;
    }
    
    /* Loading */
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid #f0f0f0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-container {
      text-align: center;
      padding: 40px 20px;
    }
    
    .loading-text {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      font-weight: 500;
    }
    
    .cookie-warning {
      background: #fef3c7;
      border-left: 3px solid #f59e0b;
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #78350f;
      margin: 8px 0;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔒 Privacy Visualizer</h1>
    <p>Know who's tracking you</p>
  </div>
  
  <div class="container">
    <div id="results">
      <div class="loading-container">
        <div class="loading-spinner"></div>
        <div class="loading-text">Analyzing page...</div>
        <div style="font-size: 11px; color: #999; margin-top: 8px;">Please wait a moment</div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
